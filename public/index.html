<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Event Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <header class="bg-primary text-white py-3 mb-4">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1 class="mb-0">
                            <i class="fas fa-graduation-cap me-2"></i>
                            Alumni Event Accounting
                        </h1>
                        <p class="mb-0 mt-1">Manage your event finances with ease</p>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <div class="balance-display">
                            <h3 class="mb-0">Current Balance</h3>
                            <h2 class="mb-0" id="currentBalance">₹0.00</h2>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Transaction Form -->
            <div class="row mb-5">
                <div class="col-12">
                    <div class="card shadow-sm" style="border: 1px solid #dee2e6;">
                        <div class="card-header bg-light text-dark" style="border-bottom: 1px solid #dee2e6;">
                            <h4 class="mb-0 text-center">
                                <i class="fas fa-plus-circle me-2"></i>
                                Add New Transaction
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            <form id="transactionForm">
                                <div class="row mb-4">
                                    <div class="col-lg-3 col-md-6 mb-3">
                                        <label for="transactionType" class="form-label fw-semibold">Transaction Type *</label>
                                        <select class="form-select form-select-lg" id="transactionType" required>
                                            <option value="">Select Type</option>
                                            <option value="credit" selected>💰 Credit (Money In)</option>
                                            <option value="debit">💸 Debit (Money Out)</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-3 col-md-6 mb-3">
                                        <label for="amount" class="form-label fw-semibold">Amount (₹) *</label>
                                        <input type="number" class="form-control form-control-lg" id="amount"
                                               step="0.01" min="0.01" placeholder="Enter amount" required>
                                    </div>
                                    <div class="col-lg-3 col-md-6 mb-3">
                                        <label for="category" class="form-label fw-semibold">Category</label>
                                        <select class="form-select form-select-lg" id="category">
                                            <option value="">Select Category</option>
                                            <option value="Registration">📝 Registration Fees</option>
                                            <option value="Food">🍽️ Food & Catering</option>
                                            <option value="Venue">🏢 Venue & Equipment</option>
                                            <option value="Transportation">🚗 Transportation</option>
                                            <option value="Entertainment">🎉 Entertainment</option>
                                            <option value="Decoration">🎨 Decoration</option>
                                            <option value="Photography">📸 Photography</option>
                                            <option value="Contribution to School">🏫 Contribution to School</option>
                                            <option value="Batchmate contribution" selected>👥 Batchmate contribution</option>
                                            <option value="Gifts to Teachers">🎁 Gifts to Teachers</option>
                                            <option value="Batch merchandise">👕 Batch merchandise</option>
                                            <option value="Concert">🎵 Concert</option>
                                            <option value="Miscellaneous">📋 Miscellaneous</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-3 col-md-6 mb-3">
                                        <label for="mode" class="form-label fw-semibold">Payment Mode</label>
                                        <select class="form-select form-select-lg" id="mode">
                                            <option value="">Select Mode</option>
                                            <option value="Cash">💵 Cash</option>
                                            <option value="Online" selected>💳 Online</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="row mb-4">
                                    <div class="col-lg-4 col-md-6 mb-3">
                                        <label for="description" class="form-label fw-semibold">Description</label>
                                        <input type="text" class="form-control form-control-lg" id="description"
                                               placeholder="Enter transaction description (optional)">
                                    </div>
                                    <div class="col-lg-4 col-md-6 mb-3">
                                        <label for="fromPerson" class="form-label fw-semibold">From/To Person</label>
                                        <select class="form-select form-select-lg" id="fromPerson">
                                            <option value="">Select Person</option>
                                            <!-- Names will be populated dynamically by JavaScript -->
                                        </select>
                                    </div>
                                    <div class="col-lg-4 col-md-6 mb-3" id="otherPersonContainer" style="display: none;">
                                        <label for="otherPerson" class="form-label fw-semibold">Enter Name</label>
                                        <input type="text" class="form-control form-control-lg" id="otherPerson"
                                               placeholder="Enter person's name">
                                    </div>
                                    <div class="col-lg-4 col-md-6 mb-3">
                                        <label for="transactionDate" class="form-label fw-semibold">Date</label>
                                        <input type="date" class="form-control form-control-lg" id="transactionDate">
                                    </div>
                                </div>
                                


                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg py-3">
                                        <i class="fas fa-plus-circle me-2"></i>
                                        Add Transaction
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Quick Stats -->
                <div class="col-12">
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <div class="card shadow-sm" style="background-color: #f8f9fa; border: 1px solid #dee2e6;">
                                <div class="card-body text-center py-4">
                                    <i class="fas fa-arrow-up fa-2x mb-2 text-success"></i>
                                    <h5 class="mb-2 text-dark">Total Credits</h5>
                                    <h3 id="totalCredits" class="text-success">₹0.00</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card shadow-sm" style="background-color: #f8f9fa; border: 1px solid #dee2e6;">
                                <div class="card-body text-center py-4">
                                    <i class="fas fa-arrow-down fa-2x mb-2 text-danger"></i>
                                    <h5 class="mb-2 text-dark">Total Debits</h5>
                                    <h3 id="totalDebits" class="text-danger">₹0.00</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transaction Statement -->
            <div class="card shadow-sm mt-5" style="border: 1px solid #dee2e6;">
                <div class="card-header bg-light" style="border-bottom: 1px solid #dee2e6;">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <h4 class="mb-0 text-dark">
                                <i class="fas fa-list me-2"></i>
                                Transaction History
                            </h4>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <button class="btn btn-outline-primary" id="exportBtn">
                                <i class="fas fa-download me-1"></i>
                                Export CSV
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4">
                    <!-- Filters with Date Range -->
                    <div class="row mb-4">
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="filterType" class="form-label text-muted small">Type</label>
                            <select class="form-select" id="filterType">
                                <option value="">All Types</option>
                                <option value="credit">💰 Credits Only</option>
                                <option value="debit">💸 Debits Only</option>
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="filterCategory" class="form-label text-muted small">Category</label>
                            <select class="form-select" id="filterCategory">
                                <option value="">All Categories</option>
                                <option value="Registration">📝 Registration</option>
                                <option value="Food">🍽️ Food & Catering</option>
                                <option value="Venue">🏢 Venue</option>
                                <option value="Transportation">🚗 Transportation</option>
                                <option value="Entertainment">🎉 Entertainment</option>
                                <option value="Decoration">🎨 Decoration</option>
                                <option value="Photography">📸 Photography</option>
                                <option value="Contribution to School">🏫 School Contribution</option>
                                <option value="Batchmate contribution">👥 Batchmate</option>
                                <option value="Gifts to Teachers">🎁 Teacher Gifts</option>
                                <option value="Batch merchandise">👕 Merchandise</option>
                                <option value="Concert">🎵 Concert</option>
                                <option value="Miscellaneous">📋 Miscellaneous</option>
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="filterMode" class="form-label text-muted small">Mode</label>
                            <select class="form-select" id="filterMode">
                                <option value="">All Modes</option>
                                <option value="Cash">💵 Cash</option>
                                <option value="Online">💳 Online</option>
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="filterPerson" class="form-label text-muted small">Person</label>
                            <select class="form-select" id="filterPerson">
                                <option value="">All Persons</option>
                                <!-- Names will be populated dynamically by JavaScript -->
                            </select>
                        </div>
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="startDate" class="form-label text-muted small">From Date</label>
                            <input type="date" class="form-control" id="startDate" placeholder="Start date">
                        </div>
                        <div class="col-lg-2 col-md-4 col-sm-6 mb-3">
                            <label for="endDate" class="form-label text-muted small">To Date</label>
                            <input type="date" class="form-control" id="endDate" placeholder="End date">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <div class="btn-group" role="group" aria-label="Date presets">
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="todayBtn">Today</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="thisWeekBtn">This Week</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="thisMonthBtn">This Month</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="lastMonthBtn">Last Month</button>
                            </div>
                        </div>
                        <div class="col-md-6 d-flex justify-content-end gap-2">
                            <button class="btn btn-outline-secondary" id="clearFiltersBtn">
                                <i class="fas fa-refresh me-1"></i>
                                Clear Filters
                            </button>
                            <button class="btn btn-primary" id="applyFiltersBtn">
                                <i class="fas fa-filter me-1"></i>
                                Apply Filters
                            </button>
                        </div>
                    </div>

                    <!-- Transactions Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>From/To</th>
                                    <th>Mode</th>
                                    <th class="text-end">Amount</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTableBody">
                                <tr>
                                    <td colspan="8" class="text-center text-muted">
                                        <i class="fas fa-spinner fa-spin me-2"></i>
                                        Loading transactions...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
